<html lang="vi">
  <head>

    <title>Bài 1 + 1b</title>

  </head>
  <body>
    <!-- ===== BÀI 1: đổi lời chào (bấm lại thì quay về) ===== -->
    <section>
      <h2>Bài 1</h2>
      <h1 id="greeting">Xin chào!</h1>
      <button id="btn">Đổi lời chào</button>
    </section>

    <hr />

    <!-- ===== BÀI 1b: duyệt / từ chối lịch ===== -->
    <section>
      <h2>Bài 1b</h2>
      <p id="status">Lịch đang chờ duyệt</p>
      <button id="btn-approve">Duyệt</button>
      <button id="btn-reject">Từ chối</button>
    </section>
  </body>
</html>
