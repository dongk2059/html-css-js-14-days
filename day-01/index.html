<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM LỊCHKHÁM</title>
</head>
<body>

<h1>Đặt lịch Khám</h1>
<div>
    <label for="name">Họ và tên bệnh nhân</label>
    <input type="text"  placeholder="Xin mời nhập họ tên">
</div>

<div>
    <label for="phone">Số điện thoại</label>
    <input type="number" placeholder="Nhập số điện thoại của bạn">
</div>

<div>
    <label for="date">Ngày</label>
    <input type="date" placeholder="Ngày">
</div>

<div>
    <label for="Time">Giờ</label>
    <input type="time" placeholder="Giờ">
</div>

<div>
    <label for="Reason">Lý do</label>
    <textarea type="text" placeholder="Tình trạng của bệnh nhân"> </textarea>
</div>

</body>
</html>
