<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM LỊCHKHÁM</title>
</head>
<body>

<h1>Đặt lịch Khám</h1>
<div>
    <label for="name">Họ và tên bệnh nhân</label>
    <input type="text" id="name" class="name" placeholder="Xin mời nhập họ tên">
</div>

<div>
    <label for="phone">Số điện thoại</label>
    <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại của bạn">
</div>

<div>
    <label for="date">Ngày</label>
    <input type="date" id="date" name="date" placeholder="Ngày">
</div>

<div>
    <label for="time">Giờ</label>
    <input type="time" id="time" name="time" placeholder="Giờ">
</div>

<div>
    <label for="reason">Lý do</label>
    <textarea id="reason" name="reason"> </textarea>
</div>

</body>
</html>
