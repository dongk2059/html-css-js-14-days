
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM LỊCH KHÁM</title>
</head>

<body>
    <h1>Đặt lịch khám</h1>

    <form method="get">

        <div>
            <label for="name">Họ và tên bệnh nhân</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Xin mời nhập họ tên"
                required
            >
        </div>

        <div>
            <label for="phone">Số điện thoại</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Nhập số điện thoại của bạn"
                required
            >
        </div>

        <div>
            <label for="date">Ngày</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
        </div>

        <div>
            <label for="time">Giờ</label>
            <input
                type="time"
                id="time"
                name="time"
                required
            >
        </div>

        <div>
            <label for="reason">Lý do</label>
            <textarea
                id="reason"
                name="reason"
                required
            ></textarea>
        </div>

        <button type="submit">Đặt lịch</button>

    </form>
</body>

</html>
